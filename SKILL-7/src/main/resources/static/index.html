<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Library Management System - Manage books with JWT authentication, GitHub and Google OAuth">
    <title>Library Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --warning: #f59e0b;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.4), 0 4px 6px -4px rgba(0,0,0,0.3);
            --radius: 12px;
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header .user-info span {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-admin { background: rgba(239,68,68,0.2); color: #fca5a5; }
        .badge-librarian { background: rgba(245,158,11,0.2); color: #fcd34d; }
        .badge-user { background: rgba(99,102,241,0.2); color: #a5b4fc; }

        /* Buttons */
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover { background: var(--danger-hover); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        .btn-google {
            background: #ffffff;
            color: #1f2937;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border: 1px solid #e2e8f0;
        }
        .btn-google:hover { background: #f8fafc; transform: translateY(-1px); }

        .btn-github {
            background: #24292e;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
        }
        .btn-github:hover { background: #2f363d; transform: translateY(-1px); }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        /* Main container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Auth section */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
        }

        .auth-card h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .auth-card p {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span { padding: 0 1rem; }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }

        .full-width { width: 100%; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 0.8rem 1.5rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab:hover { color: var(--text-primary); }

        /* Table */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .table-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 0.8rem 1.5rem;
            background: rgba(99,102,241,0.05);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid rgba(51,65,85,0.5);
            font-size: 0.9rem;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td { background: rgba(99,102,241,0.03); }

        .actions { display: flex; gap: 0.5rem; }

        /* Toast / Alert */
        .toast {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .toast-success { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
        .toast-error { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
        .toast-warning { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
            animation: scaleIn 0.2s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h3 {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 1rem; }
            .container { padding: 1rem; }
            .auth-card { margin: 1rem; }
            th, td { padding: 0.6rem 0.8rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<!-- ========== AUTH VIEW ========== -->
<div id="authView">
    <div class="header">
        <h1>📚 Library Management System</h1>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in to manage your library</p>

            <!-- OAuth Buttons -->
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <a href="/oauth2/authorization/google" class="btn btn-google full-width" style="text-decoration:none; justify-content:center;">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3h3.88c2.27-2.09 3.66-5.17 3.66-9.09z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.1C3.27 21.46 7.35 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.32c-.25-.72-.38-1.49-.38-2.32s.13-1.6.38-2.32V6.57H1.25C.45 8.16 0 9.99 0 12s.45 3.84 1.25 5.43l4.03-3.11z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.54 1.25 6.57l4.03 3.11c.95-2.83 3.6-4.93 6.72-4.93z"/>
                    </svg>
                    Continue with Google
                </a>

                <a href="/oauth2/authorization/github" class="btn btn-github full-width" style="text-decoration:none; justify-content:center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    Continue with GitHub
                </a>
            </div>

            <div class="divider"><span>or sign in with credentials</span></div>

            <!-- Login / Register tabs -->
            <div class="tabs">
                <button class="tab active" onclick="showAuthTab('login')">Sign In</button>
                <button class="tab" onclick="showAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary full-width">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required minlength="3" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email (optional)</label>
                    <input type="email" id="regEmail" placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="Min 6 characters">
                </div>
                <button type="submit" class="btn btn-primary full-width">Create Account</button>
            </form>
        </div>
    </div>
</div>

<!-- ========== APP VIEW ========== -->
<div id="appView" style="display:none">
    <div class="header">
        <h1>📚 Library Management System</h1>
        <div class="user-info">
            <span>Welcome, <strong id="displayUsername"></strong></span>
            <span id="displayRole" class="badge"></span>
            <button class="btn btn-outline btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="table-container">
            <div class="table-header">
                <h2>Books</h2>
                <button id="addBookBtn" class="btn btn-primary" onclick="openAddModal()" style="display:none">
                    + Add Book
                </button>
            </div>
            <div id="booksTableBody">
                <div class="empty-state">
                    <p>Loading books...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========== BOOK MODAL ========== -->
<div class="modal-overlay" id="bookModal">
    <div class="modal">
        <h3 id="modalTitle">Add New Book</h3>
        <form onsubmit="handleBookSubmit(event)">
            <input type="hidden" id="bookId">
            <div class="form-group">
                <label for="bookTitle">Title</label>
                <input type="text" id="bookTitle" required placeholder="Book title">
            </div>
            <div class="form-group">
                <label for="bookAuthor">Author</label>
                <input type="text" id="bookAuthor" required placeholder="Author name">
            </div>
            <div class="form-group">
                <label for="bookIsbn">ISBN</label>
                <input type="text" id="bookIsbn" required placeholder="e.g. 9780132350884">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" id="modalSubmitBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_BASE = '';
    let authToken = null;
    let currentUser = null;
    let currentRole = null;

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
        // Check for OAuth callback token in URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const username = params.get('username');
        const role = params.get('role');
        const error = params.get('error');

        if (error) {
            showToast('OAuth login failed: ' + error, 'error');
            // Clean URL
            window.history.replaceState({}, '', '/');
        } else if (token && username && role) {
            authToken = token;
            currentUser = username;
            currentRole = role;
            // Clean URL (remove token from address bar)
            window.history.replaceState({}, '', '/');
            showApp();
        }
    });

    // ===== AUTH TABS =====
    function showAuthTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    }

    // ===== LOGIN =====
    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch(API_BASE + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (res.ok) {
                authToken = data.token;
                currentUser = data.username;
                currentRole = data.role;
                showApp();
                showToast('Logged in successfully!', 'success');
            } else {
                showToast(data.message || 'Login failed', 'error');
            }
        } catch (err) {
            showToast('Connection error', 'error');
        }
    }

    // ===== REGISTER =====
    async function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById('regUsername').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;

        try {
            const res = await fetch(API_BASE + '/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email: email || null })
            });

            const data = await res.json();
            if (res.ok) {
                authToken = data.token;
                currentUser = data.username;
                currentRole = data.role;
                showApp();
                showToast('Account created successfully!', 'success');
            } else {
                const msg = data.message || (data.errors ? Object.values(data.errors).join(', ') : 'Registration failed');
                showToast(msg, 'error');
            }
        } catch (err) {
            showToast('Connection error', 'error');
        }
    }

    // ===== LOGOUT =====
    function handleLogout() {
        authToken = null;
        currentUser = null;
        currentRole = null;
        document.getElementById('appView').style.display = 'none';
        document.getElementById('authView').style.display = 'block';
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
    }

    // ===== SHOW APP =====
    function showApp() {
        document.getElementById('authView').style.display = 'none';
        document.getElementById('appView').style.display = 'block';
        document.getElementById('displayUsername').textContent = currentUser;

        const roleEl = document.getElementById('displayRole');
        roleEl.textContent = currentRole;
        roleEl.className = 'badge badge-' + currentRole.toLowerCase();

        // Show Add button only for ADMIN and LIBRARIAN
        const canWrite = currentRole === 'ADMIN' || currentRole === 'LIBRARIAN';
        document.getElementById('addBookBtn').style.display = canWrite ? 'inline-flex' : 'none';

        loadBooks();
    }

    // ===== API HELPER =====
    async function apiFetch(url, options = {}) {
        options.headers = options.headers || {};
        if (authToken) {
            options.headers['Authorization'] = 'Bearer ' + authToken;
        }
        const res = await fetch(API_BASE + url, options);

        if (res.status === 401) {
            showToast('Session expired. Please log in again.', 'warning');
            handleLogout();
            throw new Error('Unauthorized');
        }
        if (res.status === 403) {
            showToast('You do not have permission to perform this action.', 'error');
            throw new Error('Forbidden');
        }
        return res;
    }

    // ===== LOAD BOOKS =====
    async function loadBooks() {
        try {
            const res = await apiFetch('/books');
            const books = await res.json();
            renderBooks(books);
        } catch (err) {
            if (err.message !== 'Unauthorized' && err.message !== 'Forbidden') {
                showToast('Failed to load books', 'error');
            }
        }
    }

    function renderBooks(books) {
        const container = document.getElementById('booksTableBody');
        const canWrite = currentRole === 'ADMIN' || currentRole === 'LIBRARIAN';

        if (books.length === 0) {
            container.innerHTML = '<div class="empty-state"><p>No books found. Add your first book!</p></div>';
            return;
        }

        let html = '<table><thead><tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th>';
        if (canWrite) html += '<th>Actions</th>';
        html += '</tr></thead><tbody>';

        books.forEach(book => {
            html += `<tr>
                <td>${book.id}</td>
                <td>${escapeHtml(book.title)}</td>
                <td>${escapeHtml(book.author)}</td>
                <td><code>${escapeHtml(book.isbn)}</code></td>`;
            if (canWrite) {
                html += `<td class="actions">
                    <button class="btn btn-outline btn-sm" onclick="openEditModal(${book.id}, '${escapeAttr(book.title)}', '${escapeAttr(book.author)}', '${escapeAttr(book.isbn)}')">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteBook(${book.id})">Delete</button>
                </td>`;
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // ===== BOOK CRUD =====
    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'Add New Book';
        document.getElementById('modalSubmitBtn').textContent = 'Add Book';
        document.getElementById('bookId').value = '';
        document.getElementById('bookTitle').value = '';
        document.getElementById('bookAuthor').value = '';
        document.getElementById('bookIsbn').value = '';
        document.getElementById('bookModal').classList.add('active');
    }

    function openEditModal(id, title, author, isbn) {
        document.getElementById('modalTitle').textContent = 'Edit Book';
        document.getElementById('modalSubmitBtn').textContent = 'Update Book';
        document.getElementById('bookId').value = id;
        document.getElementById('bookTitle').value = title;
        document.getElementById('bookAuthor').value = author;
        document.getElementById('bookIsbn').value = isbn;
        document.getElementById('bookModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('bookModal').classList.remove('active');
    }

    async function handleBookSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('bookId').value;
        const book = {
            title: document.getElementById('bookTitle').value,
            author: document.getElementById('bookAuthor').value,
            isbn: document.getElementById('bookIsbn').value
        };

        try {
            let res;
            if (id) {
                res = await apiFetch('/books/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(book)
                });
            } else {
                res = await apiFetch('/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(book)
                });
            }

            if (res.ok) {
                closeModal();
                loadBooks();
                showToast(id ? 'Book updated!' : 'Book added!', 'success');
            } else {
                const data = await res.json();
                const msg = data.message || (data.errors ? Object.values(data.errors).join(', ') : 'Operation failed');
                showToast(msg, 'error');
            }
        } catch (err) {
            // Already handled by apiFetch
        }
    }

    async function deleteBook(id) {
        if (!confirm('Are you sure you want to delete this book?')) return;
        try {
            const res = await apiFetch('/books/' + id, { method: 'DELETE' });
            if (res.ok) {
                loadBooks();
                showToast('Book deleted!', 'success');
            } else {
                const data = await res.json();
                showToast(data.message || 'Delete failed', 'error');
            }
        } catch (err) {
            // Already handled
        }
    }

    // ===== TOAST =====
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // ===== UTILS =====
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
</script>

</body>
</html>
