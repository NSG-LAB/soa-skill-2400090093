spring.application.name=library-service

server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/library_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Error handling
server.error.include-message=always
server.error.include-stacktrace=never

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IGRvIG5vdCB1c2UgaW4gcHJvZHVjdGlvbg==}
jwt.expiration-ms=3600000

# GitHub OAuth2 — configured programmatically in OAuth2Config.java
# Set these environment variables to enable GitHub login:
#   GITHUB_CLIENT_ID=your_github_client_id
#   GITHUB_CLIENT_SECRET=your_github_client_secret
github.client.id=${GITHUB_CLIENT_ID:Ov23liakw0lpWBLbhIf2}
github.client.secret=${GITHUB_CLIENT_SECRET:}
github.client.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8080/login/oauth2/code/github}

# Logging — never log secrets or tokens
logging.level.org.springframework.security=INFO
