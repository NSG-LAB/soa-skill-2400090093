# Test configuration (overrides src/main/resources/application.properties during tests)
spring.application.name=library-service

server.port=0

# Database — use the same library_db
spring.datasource.url=jdbc:mysql://localhost:3306/library_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate — create tables fresh for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT — use a fixed test secret
jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IGRvIG5vdCB1c2UgaW4gcHJvZHVjdGlvbg==
jwt.expiration-ms=3600000

# GitHub OAuth — disabled (no client ID set, so OAuth2Config bean won't be created)
github.client.id=
github.client.secret=

# Google OAuth — disabled for tests
google.client.id=
google.client.secret=

# Error handling
server.error.include-message=always
server.error.include-stacktrace=never

# Logging
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
