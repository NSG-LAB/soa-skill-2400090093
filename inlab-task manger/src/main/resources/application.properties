spring.application.name=task-manager-service

# Server Configuration (runs on port 8090 by default, override with SERVER_PORT)
server.port=${SERVER_PORT:8090}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/task_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always
